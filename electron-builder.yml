appId: org.fosslight.scanner.gui
productName: FOSSLight Scanner
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!python-backend/*'
  - '!test-fixtures/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,RECON.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: python-backend/dist/fosslight-backend
    to: backend
win:
  executableName: fosslight-scanner-gui
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
