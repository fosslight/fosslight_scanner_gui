appId: org.fosslight.scanner.gui
productName: FOSSLight Scanner
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!python-backend/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,RECON.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # Type B: 번들 실제 Python(python\python.exe) + backend_main.py 등을 backend로.
  # 이 Python 하나가 FOSSLight 엔진 실행 + pypi venv 생성을 모두 담당한다.
  - from: python-backend/pybuild
    to: backend
win:
  executableName: fosslight-scanner-gui
publish:
  provider: github
  owner: fosslight
  repo: fosslight_scanner_gui
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
