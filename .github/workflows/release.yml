name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 태그(v0.2.5)에서 버전을 추출해 package.json/package-lock.json을 함께 동기화
      - name: Bump version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "package.json/package-lock.json version set to $version"

      - name: Install Node dependencies
        run: npm ci

      # 백엔드는 PyInstaller 동결이 아니라, 재배포 가능한 실제 Python 3.12에
      # fosslight-scanner를 설치한 번들(python-backend/pybuild)이다.
      # electron-builder.yml의 extraResources가 이 폴더를 참조하므로 반드시 먼저 만든다.
      - name: Build Python backend
        run: npm run build:backend

      - name: Build Electron app and package installer
        run: npm run build && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload setup executable to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
